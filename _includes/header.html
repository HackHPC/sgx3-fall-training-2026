<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/sgx3-logo.svg' | relative_url }}" alt="SGX3: Extend. Expand. Exemplify." width="500" height="150">
      <span class="brand-event">Fall Training 2026</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="nav-toggle-label">Menu</span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <ul>
        <li><a href="{{ '/' | relative_url }}#about">About</a></li>
        <li><a href="{{ '/' | relative_url }}#training">Training</a></li>
        <li><a href="{{ '/' | relative_url }}#benefits">Benefits</a></li>
        <li><a href="{{ '/' | relative_url }}#details">Program Details</a></li>
        <li><a href="{{ '/session-summaries/' | relative_url }}"{% if page.url contains '/session-summaries/' %} aria-current="page"{% endif %}>Session Summaries</a></li>
        <li><a href="{{ '/resources/' | relative_url }}"{% if page.url == '/resources/' %} aria-current="page"{% endif %}>Resources</a></li>
      </ul>
    </nav>
  </div>
</header>
