# Links shown on the Resources page (/resources/), grouped by category.
# Add new links to the matching group. `session` is the session whose article
# lists the link, or else the first article that names it. Every link needs a
# session: links no article mentions don't belong on this page.

- group: Program & Cohort
  links:
    - name: HackHPC SGX3 Event Site
      url: https://hackhpc.org/sgx3-fall-training-2026/
      description: Official program portal providing event schedules, training modules, task sheet guidelines, and curriculum resources.
      session: 1

- group: Training Modules
  links:
    - name: Amigoscode (Vim Essentials, Spring Boot for Beginners)
      url: https://amigoscode.com/
      description: Course platform for the Vim Essentials and Spring Boot for Beginners task sheet modules.
      session: 2
    - name: Kaggle Learn Python Course
      url: https://www.kaggle.com/learn/python
      description: Official Kaggle interactive Python course used for completing the mandatory Task Sheet Python certification module.
      session: 5
    - name: Kaggle Learn – Intro to Machine Learning
      url: https://www.kaggle.com/learn/intro-to-machine-learning
      description: Kaggle certification course (about 3 hours) on decision trees, model validation, and scoring.
      session: 2
    - name: OverTheWire Bandit Wargames
      url: https://overthewire.org/wargames/bandit/
      description: Official cybersecurity challenge portal used throughout the training to teach Linux commands and terminal navigation.
      session: 3
    - name: Google Cloud Skills Boost
      url: https://www.cloudskillsboost.google/
      description: Platform for the Google Cloud Computing Foundations "Cloud Computing Fundamentals" course (about 8 hours).
      session: 2
    - name: Science Gateways Webinar Archive
      url: https://sciencegateways.org/networking-community/webinar-archive
      description: Archive of community webinars used for the 2-page webinar review assignments.
      session: 2

