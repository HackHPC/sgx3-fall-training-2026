- group: Program Team
  people:
    - name: Je'aime Powell
      school: Elizabeth City State University
      role: Trainer
      initials: JP
      photo: jeaime-powell.jpg
      linkedin: https://www.linkedin.com/in/jeaimehp
      bio: >-
        Je'aime is co-founder of the Abundant Frontier Institute, a Product and Systems Analyst at
        Omnibond, and has led HackHPC since 2018, with 32+ events reaching 68 academic institutions.
        Earlier roles include Senior Systems Administrator at the Texas Advanced Computing Center
        and Lecturer at UT Austin. Je'aime also serves on the ADMI Board and as a PEARC27 Student
        Program Co-Chair.
    - name: Linda Hayden
      school: Elizabeth City State University
      role: Program Lead
      initials: LH
      photo: linda-hayden.jpg
      linkedin: https://www.linkedin.com/in/linda-hayden-5a8b424
      bio: >-
        Dr. Hayden directs the Center of Excellence in Remote Sensing Education and Research at
        Elizabeth City State University and leads workforce development for the Science Gateways
        Community Institute. Dr. Hayden holds a Ph.D. in Mathematics and Education from American
        University and is an NSF Presidential Awardee for Excellence in Science, Mathematics and
        Engineering Mentoring.
    - name: Qimora Mason
      school: Elizabeth City State University
      major: "Computer Science & Mathematics"
      classification: Senior
      role: Assistant Trainer
      initials: QM
      photo: qimora-mason.jpg
      linkedin: https://www.linkedin.com/in/qimora-mason
      bio: >-
        Qimora studies Computer Science and Mathematics at Elizabeth City State University, with a
        focus on machine learning and human-centered computing. Qimora has done research at Sandia
        National Laboratories and the UVA School of Data Science, and has been part of SGX3 for about
        three years, first as a student trainee and now as a student trainer.
    - name: Mohamed Elbakary
      school: Elizabeth City State University
      role: Associate Professor
      initials: ME
      bio: >-
        Dr. Elbakary is an Associate Professor in the Department of Mathematics, Computer Science, and
        Engineering Technology at Elizabeth City State University. Dr. Elbakary is also HackHPC@ADMI26
        event staff, with experience in computer science, engineering technology, applied research,
        and student mentorship.

